name: PopCulture Radar

# COME FUNZIONA LA FREQUENZA
# Il "cron" di GitHub non è affidabile: i giri programmati partono spesso con ore di ritardo o saltano.
# Per questo ogni giro, finito il lavoro, aspetta fino a 5 minuti dal proprio avvio e lancia il giro successivo
# (a catena). Il "cron" qui sotto serve solo da riserva: se la catena si interrompe, la riavvia.
# ATTENZIONE: la catena parte SOLO se il repository è PUBBLICO (i minuti sono illimitati).
# Se lo rendi di nuovo privato la catena si ferma da sola e resta solo il cron (ogni 30 minuti).
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Cosa vuoi fare?"
        type: choice
        default: run
        options:
          - run
          - dry-run
          - check-sources
          - check-llm
          - check-wordpress
          - test-notify
          - chat-id
          - digest-now

permissions:
  contents: write
  actions: write

concurrency:
  group: popculture-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: "1"
      MODE: ${{ github.event.inputs.mode || 'run' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      WP_SITE_URL: ${{ secrets.WP_SITE_URL }}
      WP_USER: ${{ secrets.WP_USER }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
      WP_PAGE_PASSWORD: ${{ secrets.WP_PAGE_PASSWORD }}
      WP_PAGE_SLUG: ${{ secrets.WP_PAGE_SLUG }}
    steps:
      - uses: actions/checkout@v4

      - name: Segna l'ora di partenza
        run: echo "RADAR_START=$(date +%s)" >> "$GITHUB_ENV"

      # La memoria del Radar (notizie già viste) vive su un branch separato "radar-state",
      # così non sporca la cronologia del progetto.
      - name: Carica la memoria
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STATE_DIR="$RUNNER_TEMP/radar-state"
          echo "STATE_PATH=$STATE_DIR/state.json" >> "$GITHUB_ENV"
          REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$REPO_URL" radar-state >/dev/null 2>&1; then
            git clone --quiet --depth=1 --branch radar-state "$REPO_URL" "$STATE_DIR"
          else
            mkdir -p "$STATE_DIR"
            git -C "$STATE_DIR" init --quiet -b radar-state
            git -C "$STATE_DIR" remote add origin "$REPO_URL"
          fi

      - name: Esegui il Radar
        run: |
          case "$MODE" in
            run)            python3 radar.py ;;
            dry-run)        python3 radar.py --dry-run ;;
            check-sources)  python3 radar.py --check-sources --all ;;
            check-llm)      python3 radar.py --check-llm ;;
            check-wordpress) python3 radar.py --check-wordpress ;;
            test-notify)    python3 radar.py --test-notify ;;
            chat-id)        python3 radar.py --telegram-chat-id ;;
            digest-now)     python3 radar.py --digest-now ;;
            *) echo "Modalità sconosciuta: $MODE"; exit 2 ;;
          esac

      - name: Salva la memoria
        if: ${{ always() && (github.event_name == 'schedule' || github.event.inputs.mode == 'run' || github.event.inputs.mode == 'digest-now' || github.event.inputs.mode == '') }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/radar-state"
          [ -f state.json ] || exit 0
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add state.json
          if git rev-parse --verify HEAD >/dev/null 2>&1; then
            git commit --quiet --amend --allow-empty -m "radar state"
          else
            git commit --quiet --allow-empty -m "radar state"
          fi
          git push --quiet --force origin radar-state

      # Giro successivo a catena: solo per i giri normali, solo se il repository è pubblico
      # e solo se il giro non è stato annullato a mano (annullare un giro ferma la catena).
      - name: Aspetta e lancia il giro successivo
        if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event.inputs.mode == 'run' || github.event.inputs.mode == '') }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          PRIVATE=$(gh repo view --json isPrivate -q .isPrivate || echo true)
          if [ "$PRIVATE" != "false" ]; then
            echo "Repository privato (o non verificabile): la catena si ferma per non consumare i minuti gratuiti."
            exit 0
          fi
          ELAPSED=$(( $(date +%s) - RADAR_START ))
          WAIT=$(( 300 - ELAPSED ))
          if [ "$WAIT" -gt 0 ]; then sleep "$WAIT"; fi
          gh workflow run radar.yml --ref "${GITHUB_REF_NAME:-main}" -f mode=run
